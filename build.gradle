plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
	id 'com.gradleup.shadow' version '9.6.0'
}

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'NotEnoughUpdates'
		url = 'https://maven.notenoughupdates.org/releases/'
	}
}

configurations {
	// Libraries that get bundled (and relocated) into the mod jar.
	shadowImpl
	implementation.extendsFrom shadowImpl
	moulconfigJar
}

// MoulConfig without its platform registration, so that NyPlatform (the recoloured one) is the only
// platform it finds. See src/main/resources/META-INF/services.
def strippedMoulConfig = tasks.register('strippedMoulConfig', Jar) {
	archiveBaseName = 'moulconfig-stripped'
	archiveVersion = project.moulconfig_version
	destinationDirectory = layout.buildDirectory.dir('moulconfig')
	from { zipTree(configurations.moulconfigJar.singleFile) }
	exclude 'META-INF/services/**'
}

loom {
	accessWidenerPath = file("src/main/resources/nyaddons.accesswidener")

	mods {
		"nyaddons" {
			sourceSet sourceSets.main
		}
	}
}

fabricApi {
	// In-game tests: `./gradlew runClientGameTest` launches the game, runs src/gametest and saves screenshots.
	configureTests {
		createSourceSet = true
		modId = "nyaddons-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// The config screen library SkyHanni uses.
	moulconfigJar("org.notenoughupdates.moulconfig:modern-26.1:${project.moulconfig_version}") {
		transitive = false
	}
	shadowImpl files(strippedMoulConfig)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	from("LICENSE") {
		rename { "LICENSE_NyAddOns" }
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	archiveClassifier = 'dev'
}

shadowJar {
	configurations = [project.configurations.shadowImpl]
	archiveClassifier = ''
	relocate 'io.github.notenoughupdates.moulconfig', 'dev.nytrix.nyaddons.deps.moulconfig'
	// src/main/resources carries the service file under its relocated name, pointing at NyPlatform.
	exclude 'META-INF/services/io.github.notenoughupdates.moulconfig.common.IMinecraft'
	// MoulConfig's own access widener is replaced by nyaddons.accesswidener; its licence text is kept.
	exclude 'moulconfig.accesswidener'
	rename { it == 'LICENSE' ? 'LICENSE_MoulConfig' : it }
}

assemble.dependsOn shadowJar

// The in-game tests again, but against the finished mod jar in a production-style launch:
// `./gradlew prodClientGameTest`. Catches packaging mistakes the development run cannot.
configurations {
	productionRuntimeMods
}

dependencies {
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	productionRuntimeMods "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

def gametestJar = tasks.register('gametestJar', Jar) {
	archiveClassifier = 'gametest'
	from sourceSets.gametest.output
}

tasks.register('prodClientGameTest', net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	mods.setFrom(shadowJar, gametestJar, configurations.productionRuntimeMods)
	jvmArgs.add('-Dfabric.client.gametest')
	runDir = layout.buildDirectory.dir('run/prodClientGameTest')
	doFirst {
		delete runDir
	}
}
